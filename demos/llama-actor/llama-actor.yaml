# Namespace + WorkerPool for the llama-actor demo. Pool is sized for one
# actor-per-worker at the ActorTemplate's 2 CPU / 2.5 GiB limits.
apiVersion: v1
kind: Namespace
metadata:
  name: ate-demo-llama-actor

---

apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: llama-actor
  namespace: ate-demo-llama-actor
  labels:
    workload: llama-actor
spec:
  replicas: 2
  workerImage: ko://github.com/agent-substrate/substrate/cmd/ateom-gvisor
  template:
    nodeSelector:
      ate.dev/substrate-version: "${SUBSTRATE_VERSION}"
    resources:
      limits:
        cpu: "2"
        memory: 3Gi
      requests:
        cpu: 500m
        memory: 3Gi
